services:
  crm:
    # Phase 9 [EXTENDED] -- build context widened from ./mock_services/crm
    # to the repo root: this service's _publish_seed_events() now imports
    # the top-level events/ package, which isn't visible from a build
    # context scoped to this directory alone (05-DEVELOPMENT-LOG.md's
    # Phase 9 Docker-networking fix).
    build:
      context: .
      dockerfile: mock_services/crm/Dockerfile
    ports:
      - "8001:8001"
    env_file: .env
    environment:
      # Overrides .env's KAFKA_BOOTSTRAP_SERVERS=localhost:9092, which is
      # only correct from the *host* (Kafka's port is published there).
      # From inside a container on this compose network, Kafka is only
      # reachable by its service name.
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    # CMD lives in mock_services/crm/Dockerfile -- Phase 1

  billing:
    # See crm's comment above -- also now needs mock_services/crm's seed
    # data for its customer_id -> order_id cross-reference (Phase 9).
    build:
      context: .
      dockerfile: mock_services/billing/Dockerfile
    ports:
      - "8002:8002"
    env_file: .env
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    # CMD lives in mock_services/billing/Dockerfile -- Phase 1

  provisioning:
    # See crm's comment above.
    build:
      context: .
      dockerfile: mock_services/provisioning/Dockerfile
    ports:
      - "8003:8003"
    env_file: .env
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    # CMD lives in mock_services/provisioning/Dockerfile -- Phase 1

  inventory:
    # Widened for consistency with the other 3 mock services' build
    # context, even though this one doesn't need events/ or a sibling
    # mock_services/* package today (04-BUILD-PLAN.md names no
    # inventory-specific Kafka topic).
    build:
      context: .
      dockerfile: mock_services/inventory/Dockerfile
    ports:
      - "8004:8004"
    env_file: .env
    # CMD lives in mock_services/inventory/Dockerfile -- Phase 1

  neo4j:
    # Phase 8 [EXTENDED] -- local Neo4j, not Aura. The original plan
    # (02-ARCHITECTURE.md Section 5) called for reusing the Neo4j Aura
    # instance from earlier coursework, but that free-tier instance had
    # been auto-paused-then-deleted from inactivity by the time this phase
    # started (verified: its hostname no longer resolves at all, not a
    # transient outage). A real, local Neo4j via Docker is still genuinely
    # real infrastructure for testing/verification purposes -- same
    # Core/Extended-swap honesty already applied elsewhere in this project
    # (SQLite->Postgres, Chroma->Pinecone); Aura remains the named
    # production-equivalent target, just not what's actually running here.
    image: neo4j:5-community
    ports:
      - "7474:7474"  # browser UI (http://localhost:7474)
      - "7687:7687"  # bolt protocol -- what the agent actually connects to
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
    volumes:
      - neo4j_data:/data

  kafka:
    # Phase 9 [EXTENDED] -- KRaft mode (04-BUILD-PLAN.md's own wording: "no
    # separate Zookeeper needed"), a single-node broker acting as both
    # broker and controller. Real Kafka via Docker, same "stub first, real
    # infrastructure once Core passes evals" principle already applied to
    # Neo4j in Phase 8 -- Core's eval suite already passed, so there's no
    # reason to stub this.
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Two listeners, not one: PLAINTEXT_HOST is what host-side clients use
      # (pytest, `python -m events.topics`, a local uvicorn dev run --
      # advertised as localhost:9092, matching the published port above).
      # PLAINTEXT is for other containers on this compose network (the 3
      # mock services) -- advertised by service name, since "localhost"
      # from inside another container resolves to that container itself,
      # not this one (found running the full docker-compose stack for
      # Phase 9's final review; see 05-DEVELOPMENT-LOG.md).
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      # The 3 mock services below wait on this (depends_on) -- they only
      # publish their seed events once, at their own startup, and degrade
      # silently if Kafka isn't reachable yet (by design, so a down broker
      # never blocks their read endpoints). Without this healthcheck, a
      # cold `docker compose up` starts everything in parallel and loses
      # the race against Kafka's own ~10s startup time, silently skipping
      # every seed-event publish (found running the full stack for
      # Phase 9's final review; see 05-DEVELOPMENT-LOG.md).
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  neo4j_data:
